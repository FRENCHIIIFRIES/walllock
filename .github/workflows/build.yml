name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease lintDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Walllock.apk

      - uses: actions/upload-artifact@v4
        with:
          name: walllock-apk
          path: Walllock.apk
          if-no-files-found: error

      # Only the default branch publishes releases, and the in-app updater only trusts releases whose
      # notes carry the channel mark below.
      - name: Publish release
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Walllock build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Walllock.apk
          body: |
            Tap **Walllock.apk** below on your phone to download and install it.
            Built from ${{ github.sha }} on ${{ github.ref_name }}.

            channel: walllock-main
